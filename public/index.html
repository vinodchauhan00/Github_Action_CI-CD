<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Demo · Notes</title>
  <style>
    :root { color-scheme: light dark; --accent: #6366f1; }
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { margin-bottom: .25rem; } .sub { opacity: .65; margin-top: 0; }
    form { display: flex; gap: .5rem; margin: 1.5rem 0; }
    input { flex: 1; padding: .7rem; border-radius: .6rem; border: 1px solid #8884; background: transparent; color: inherit; }
    button { padding: .7rem 1rem; border: 0; border-radius: .6rem; background: var(--accent); color: #fff; cursor: pointer; }
    li { display: flex; justify-content: space-between; gap: 1rem; padding: .7rem .9rem; margin-bottom: .5rem; border: 1px solid #8883; border-radius: .6rem; list-style: none; }
    li button { background: transparent; color: #ef4444; padding: 0 .4rem; }
    ul { padding: 0; } footer { margin-top: 2rem; font: .8rem ui-monospace, monospace; opacity: .6; }
  </style>
</head>
<body>
  <h1>📝 Notes</h1>
  <p class="sub">Tiny app for practising Docker, GitHub Actions and AWS.</p>
  <form id="form"><input id="text" placeholder="Write a note…" maxlength="200" required /><button>Add</button></form>
  <ul id="list"></ul>
  <footer id="ver">loading version…</footer>
  <script>
    const list = document.getElementById('list');
    async function load() {
      const notes = await (await fetch('/api/notes')).json();
      list.replaceChildren(...notes.map((n) => {
        const li = document.createElement('li');
        const span = document.createElement('span'); span.textContent = n.text;
        const del = document.createElement('button'); del.textContent = '✕'; del.title = 'Delete';
        del.onclick = async () => { await fetch('/api/notes/' + n.id, { method: 'DELETE' }); load(); };
        li.append(span, del); return li;
      }));
    }
    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('text');
      await fetch('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: input.value }) });
      input.value = ''; load();
    };
    fetch('/api/version').then((r) => r.json()).then((v) => {
      document.getElementById('ver').textContent = `v${v.version} · commit ${String(v.commit).slice(0, 7)}`;
    });
    load();
  </script>
</body>
</html>
