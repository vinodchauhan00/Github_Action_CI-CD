name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# a newer PR push cancels the older run; deployments on main are never cancelled mid-way
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------- 1. TEST ----------
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # ---------- 2. BUILD DOCKER IMAGE (push only from main) ----------
  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 3. DEPLOY TO AWS EC2 (main only) ----------
  deploy:
    name: Deploy to EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf 'Host *\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 20\n  IdentityFile ~/.ssh/deploy_key\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: ssh "$EC2_USER@$EC2_HOST" "echo connected && docker --version && docker compose version"

      - name: Copy compose file to server
        run: |
          ssh "$EC2_USER@$EC2_HOST" "mkdir -p ~/app"
          scp docker-compose.prod.yml "$EC2_USER@$EC2_HOST:~/app/docker-compose.yml"

      - name: Pull new image and restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | ssh "$EC2_USER@$EC2_HOST" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh "$EC2_USER@$EC2_HOST" "cd ~/app && export IMAGE='$IMAGE' TAG='${{ github.sha }}' && docker compose pull && docker compose up -d && docker image prune -f"

      - name: Smoke test the live site
        run: |
          for i in $(seq 1 20); do
            out=$(curl -fsS "http://$EC2_HOST/api/version" || true)
            echo "attempt $i: $out"
            echo "$out" | grep -q "${{ github.sha }}" && echo "Deployed commit is live ✅" && exit 0
            sleep 3
          done
          echo "New version did not come up in time ❌" && exit 1